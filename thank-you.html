<!-- Thank-you Raw HTML. Padding 0. Align left. -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap");

.ds{
  font-family:Outfit,system-ui,sans-serif;
  color:#F4E8D4;
  background:#0E1525;
  width:100vw;
  max-width:100vw;
  margin-left:50%;
  transform:translateX(-50%);
  overflow:hidden;
}
.ds *{box-sizing:border-box}
.ds img,.ds video{max-width:100%;height:auto}

.ds-hero{
  position:relative;
  min-height:100svh;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}
.ds-hero video,
.ds-hero img.ds-fall{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 62%;
}
.ds-veil{
  position:absolute;inset:0;
  background:linear-gradient(to top,#0E1525 8%,rgba(14,21,37,.4) 45%,rgba(14,21,37,.15) 100%);
}
.ds-copy{
  position:relative;
  width:min(1120px, calc(100% - 40px));
  margin:0 auto;
  padding:0 0 56px;
}
.ds-k{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#C9A84C;margin:0 0 16px}
.ds-h1{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(34px, 6.4vw, 88px);
  line-height:1.04;
  font-weight:500;
  margin:0 0 18px;
  color:#F4E8D4;
  letter-spacing:-.03em;
  max-width:14ch;
}
.ds-lead{font-size:clamp(16px, 1.6vw, 22px);line-height:1.5;color:#C9BBA4;margin:0;max-width:28em}

.ds-body{
  width:min(1120px, calc(100% - 40px));
  margin:0 auto;
  padding:24px 0 96px;
}
.ds-split{
  display:grid;
  grid-template-columns:1fr;
  gap:32px;
  align-items:start;
}
.ds-h2{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(24px, 3vw, 36px);
  font-weight:500;
  margin:48px 0 14px;
  color:#F4E8D4;
}
.ds-p{font-size:clamp(15px, 1.15vw, 18px);line-height:1.75;color:#C9BBA4;margin:0 0 14px;max-width:40em}
.ds-rule{border:0;border-top:1px solid rgba(201,168,76,.28);margin:40px 0}
.ds-ul{list-style:none;padding:0;margin:8px 0 0}
.ds-ul li{
  border-top:1px solid rgba(201,168,76,.18);
  padding:14px 0;
  color:#C9BBA4;
  font-size:clamp(15px, 1.1vw, 17px);
  line-height:1.55;
}

.ds-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin:24px 0 8px;
}
.ds-grid img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}

.ds-reasons{
  display:grid;
  grid-template-columns:1fr;
  gap:8px 40px;
}
.ds-n{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C9A84C;margin:22px 0 4px}
.ds-t{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(20px, 2vw, 26px);margin:0 0 6px;color:#F4E8D4}

.ds-pay{margin-top:56px;padding-top:8px}
.ds-stat{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(48px, 8vw, 80px);
  line-height:1;
  color:#C9A84C;
  margin:0;
}
.ds-stat span{
  display:block;
  font-family:Outfit,sans-serif;
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#8B8173;
  margin-top:10px;
}

@media (min-width:640px){
  .ds-copy, .ds-body{width:min(1120px, calc(100% - 80px))}
  .ds-grid{grid-template-columns:1fr 1fr 1fr}
}
@media (min-width:900px){
  .ds-hero{min-height:100vh}
  .ds-copy{padding-bottom:72px}
  .ds-split{grid-template-columns:1.15fr .85fr;gap:64px;margin-top:16px}
  .ds-reasons{grid-template-columns:1fr 1fr}
  .ds-grid{margin-top:0}
}
@media (min-width:1200px){
  .ds-h1{font-size:88px}
}
</style>
<div class="ds">
  <div class="ds-hero" style="min-height:70svh">
    <img class="ds-fall" src="https://cdn.jsdelivr.net/gh/wablaster/dont-send-it-media@main/morning.jpg" alt="">
    <div class="ds-veil"></div>
    <div class="ds-copy">
      <p class="ds-k">Paid</p>
      <h1 class="ds-h1">Night 1 is coming.<br>Put the phone down.</h1>
      <p class="ds-lead">The extra message does not go to them tonight. It goes on the page.</p>
    </div>
  </div>
  <div class="ds-body">
    <p class="ds-p">Open the mail you paid with. Log in. Write the send on Night 1. Do not copy it to the thread.</p>
    <p class="ds-p">If the mail is slow, look in promotions.</p>
  </div>
</div>
